[package]
name = "chaos"
version = "0.1.0"
edition = "2021"

[dependencies]
common    = { path = "../common" }
consensus = { path = "../consensus" }
tokio     = { workspace = true }
tracing   = { workspace = true }
tracing-subscriber = { version = "0.3" }
serde     = { workspace = true }
serde_json = "1"
rand      = "0.8"
clap      = { version = "4", features = ["derive"] }
anyhow    = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }